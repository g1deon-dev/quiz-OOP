.opt input{margin-top:4px}

.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:.92rem}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}

.fb .why{color:var(--muted);display:block;margin-top:2px}

", "`false`", "`null`", "It throws FileNotFoundException"], "a": [1], "tag": "Multiple choice"}, {"n": 91, "part": "Part 9: File Handling", "code": null, "why": "it only creates a `File` object that represents the name. The file is created by `createNewFile()` or by writing to it.", "type": "single", "p": "True or False: The statement `new File(\"data.txt\")` immediately creates an empty file named data.txt on disk.", "o": ["True", "False"], "a": [1], "tag": "Multiple choice"}, {"n": 92, "part": "Part 9: File Handling", "code": null, "why": null, "type": "single", "p": "Which class is the easiest choice for writing basic text to a file?", "o": ["FileWriter", "FileInputStream", "Scanner", "JOptionPane"], "a": [0], "tag": "Multiple choice"}, {"n": 93, "part": "Part 9: File Handling", "code": null, "why": null, "type": "single", "p": "Which statement opens `a.txt` so that new text is added to the end instead of replacing the old content?", "o": ["`new FileWriter(\"a.txt\", false)`", "`new FileWriter(\"a.txt\", true)`", "`new FileWriter(\"a.txt\", \"append\")`", "`new FileAppender(\"a.txt\")`"], "a": [1], "tag": "Multiple choice"}, {"n": 94, "part": "Part 9: File Handling", "code": "try (FileWriter w = new FileWriter(\"a.txt\")) {\n    w.write(\"One\");\n}\ntry (FileWriter w = new FileWriter(\"a.txt\")) {\n    w.write(\"Two\");\n}", "why": "without the `true` argument, `FileWriter` overwrites the existing content.", "type": "text", "kind": "code", "a": "Two", "p": "Assume `a.txt` does not exist and IOException is handled. What does `a.txt` contain after this code runs?", "tag": "Predict the output"}, {"n": 95, "part": "Part 9: File Handling", "code": "try (FileWriter w = new FileWriter(\"b.txt\")) {\n    w.write(\"One\");\n}\ntry (FileWriter w = new FileWriter(\"b.txt\", true)) {\n    w.write(\"Two\");\n}", "why": null, "type": "text", "kind": "code", "a": "OneTwo", "p": "Assume `b.txt` does not exist and IOException is handled. What does `b.txt` contain after this code let st;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const L='abcdefghij';
const norm=(q,s)=>q.kind==='term'?s.toLowerCase().replace(/[^a-z0-9]/g,''):s.replace(/\s+/g,'').replace(/;$/,'');
function body(q,i){
  if(q.type==='single')return q.o.map((o,j)=>`<button class="opt" data-act="pick" data-i="${i}" data-o="${j}"><b>${L[j]}.</b><span>${fmt(o)}</span></button>`).join('');
  if(q.type==='multi')return q.o.map((o,j)=>`<label class="opt"><input type="checkbox" data-o="${j}"><span>${fmt(o)}</span></label>`).join('')+`<button class="btn" data-act="check" data-i="${i}">Check</button>`;
  const rows=q.a.split('\n').length;
  const f=rows>1?`<textarea class="ans" rows="${rows+1}" placeholder="Type the output"></textarea>`:`<input class="ans" type="text" autocomplete="off" spellcheck="false" placeholder="${q.kind==='term'?'Type the term':'Type your answer'}">`;
  return f+`<button class="btn" data-act="check" data-i="${i}">Check</button>`;
}
function render(){
  st=Q.map(()=>null);let h='',part='';
  Q.forEach((q,i)=>{
    if(q.part!==part){part=q.part;h+=`<h2>${esc(part)}</h2>`}
    h+=`<section class="q" id="q${i}"><div class="qh"><span class="n">${q.n}</span><span class="tag">${q.tag}</span></div><p class="p">${fmt(q.p)}</p>${q.code?`<pre>${esc(q.code)}</pre>`:''}<div class="b">${body(q,i)}</div><div class="fbw"></div></section>`;
  });
  document.getElementById('list').innerHTML=h;
  document.getElementById('res').style.display='none';
  upd();
}
function upd(){
  const a=st.filter(x=>x).length,c=st.filter(x=>x==='ok').length;
  document.getElementById('stat').textContent=`Answered ${a}/${Q.length} · Correct ${c}`;
  document.querySelector('#prog i').style.width=(a/Q.length*100)+'%';
}
function done(i,ok,extra){
  const q=Q[i],el=document.getElementById('q'+i);
  st[i]=ok?'ok':'bad';
  el.className='q '+st[i];
  el.querySelectorAll('button[data-act],input,textarea').forEach(x=>x.disabled=true);
  el.querySelector('.fbw').innerHTML=`<div class="fb ${st[i]}"><b>${ok?'Correct':'Not quite'}</b>${extra||''}${q.why?`<span class="why">${fmt(q.why)}</span>`:''}</div>`;
  upd();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const i=+b.dataset.i,q=Q[i],el=document.getElementById('q'+i),act=b.dataset.act;
  if(act==='pick'){
    const o=+b.dataset.o;
    el.querySelectorAll('.opt').forEach((x,j)=>{if(q.a.includes(j))x.classList.add('ok');else if(j===o)x.classList.add('bad')});
    done(i,q.a.includes(o));
  }else if(act==='check'){
    if(q.type==='multi'){
      const sel=[...el.querySelectorAll('input')].map((x,j)=>x.checked?j:-1).filter(j=>j>=0);
      if(!sel.length)return;
      el.querySelectorAll('.opt').forEach((x,j)=>{if(q.a.includes(j))x.classList.add('ok');else if(sel.includes(j))x.classList.add('bad')});
      done(i,sel.length===q.a.length&&sel.every(j=>q.a.includes(j)));
    }else{
      const v=el.querySelector('.ans').value;if(!v.trim())return;
      const ok=norm(q,v)===norm(q,q.a);
      done(i,ok,ok?'':`<div>Expected answer:</div><pre>${esc(q.a)}</pre><button class="btn ghost" data-act="mark" data-i="${i}">I was right</button>`);
    }
  }else if(act==='mark'){
    st[i]='ok';el.className='q ok';
    const f=el.querySelector('.fb');f.className='fb ok';f.querySelector('b').textContent='Correct';
    b.remove();upd();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('input.ans')){e.preventDefault();e.target.closest('.q').querySelector('[data-act="check"]').click()}
});
document.getElementById('fin').onclick=()=>{
  const c=st.filter(x=>x==='ok').length,u=st.filter(x=>!x).length,r=document.getElementById('res');
  r.innerHTML=`<b>Score: ${c}/${Q.length} (${Math.round(c/Q.length*100)}%)</b>${u?` · ${u} unanswered`:''}`;
  r.style.display='block';r.scrollIntoView({behavior:'smooth',block:'start'});
};
document.getElementById('rst').onclick=()=>{render();window.scrollTo({top:0})};
render();
</script>
