 of the files inside a directory?","o":["`names()`","`list()`","`getName()`","`mkdir()`"],"a":[1],"tag":"Multiple choice"},{"n":261,"part":"Part 9: File Handling","code":null,"why":null,"type":"single","p":"Which import is needed to use the `File` class?","o":["`import java.util.File;`","`import java.io.File;`","`import javax.swing.File;`","`import java.text.File;`"],"a":[1],"tag":"Multiple choice"},{"n":262,"part":"Part 9: File Handling","code":null,"why":null,"type":"single","p":"Which exception can `createNewFile()` throw, so it must be inside a try-catch?","o":["ArithmeticException","NumberFormatException","IOException","ClassCastException"],"a":[2],"tag":"Multiple choice"},{"n":263,"part":"Part 9: File Handling","code":null,"why":null,"type":"single","p":"True or False: `FileWriter` creates the file for you if it does not exist yet.","o":["True","False"],"a":[0],"tag":"Multiple choice"},{"n":264,"part":"Part 9: File Handling","code":null,"why":null,"type":"single","p":"True or False: Forgetting to close a `FileWriter` can cause some data to not be saved to the file.","o":["True","False"],"a":[0],"tag":"Multiple choice"},{"n":265,"part":"Part 9: File Handling","code":null,"why":null,"type":"single","p":"Which statement closes a `FileWriter` named `myWriter`?","o":["`myWriter.end();`","`myWriter.close();`","`myWriter.stop();`","`close(myWriter);`"],"a":[1],"tag":"Multiple choice"},{"n":266,"part":"Part 9: File Handling","code":null,"why":null,"type":"single","p":"How should a single backslash in a Windows file path be written inside a Java String?","o":["As one backslash `\\`","As a forward slash `/\\`","As two backslashes `\\\\`","As a percent sign `%`"],"a":[2],"tag":"Multiple choice"},{"n":267,"part":"Part 9: File Handling","code":"Scanner r = new Scanner(new File(\"notes.txt\"));\nint count = 0;\nwhile (r.hasNextLine()) {\n    r.nextLine();\n    count++;\n}\nSystem.out.println(count);","why":null,"type":"text","kind":"code","a":"2","p":"The file `notes.txt` contains two lines of text. What will be the output of the following Java code?","tag":"Predict the output"},{"n":268,"part":"Part 9: File Handling","code":null,"why":null,"type":"single","p":"Which class is the better choice for writing binary data such as images or PDFs?","o":["FileWriter","FileOutputStream","Scanner","BufferedReader"],"a":[1],"tag":"Multiple choice"},{"n":269,"part":"Part 9: File Handling","code":null,"why":null,"type":"single","p":"Which class is recommended for writing large text files faster?","o":["FileOutputStream","JOptionPane","BufferedWriter","FileInputStream"],"a":[2],"tag":"Multiple choice"},{"n":270,"part":"Part 9: File Handling","code":"File f = new File(\"missing.txt\");\nSystem.out.println(f.exists());","why":null,"type":"text","kind":"code","a":"false","p":"Assume `missing.txt` does not exist. What will be the output of the following Java code?","tag":"Predict the output"},{"n":271,"part":"Part 9: File Handling","code":null,"why":null,"type":"single","p":"True or False: `delete()` returns `true` when the file was successfully deleted.","o":["True","False"],"a":[0],"tag":"Multiple choice"},{"n":272,"part":"Part 9: File Handling","code":null,"why":null,"type":"multi","p":"Which of the following classes can be used to read a file?","o":["Scanner","BufferedReader","FileInputStream","FileWriter","JOptionPane"],"a":[0,1,2],"tag":"Select all that apply"},{"n":273,"part":"Part 9: File Handling","code":null,"why":null,"type":"single","p":"What is the main advantage of try-with-resources?","o":["It makes the code run faster","It removes the need for any exception handling","It closes the resource automatically when the block ends","It allows files to be deleted"],"a":[2],"tag":"Multiple choice"},{"n":274,"part":"Part 9: File Handling","code":null,"why":null,"type":"single","p":"When you create `new File(\"filename.txt\")` with just a file name, where is the file created?","o":["On the desktop always","In the program's working folder (normally const PICK=100;
let Q=[];
function pickSet(){
  const a=ALL.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a.slice(0,PICK).sort((x,y)=>x.n-y.n).map((q,k)=>Object.assign({},q,{n:k+1}));
}
let st;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const L='abcdefghij';
const norm=(q,s)=>q.kind==='term'?s.toLowerCase().replace(/[^a-z0-9]/g,''):s.replace(/\s+/g,'').replace(/;$/,'');
function body(q,i){
  if(q.type==='single')return q.o.map((o,j)=>`<button class="opt" data-act="pick" data-i="${i}" data-o="${j}"><b>${L[j]}.</b><span>${fmt(o)}</span></button>`).join('');
  if(q.type==='multi')return q.o.map((o,j)=>`<label class="opt"><input type="checkbox" data-o="${j}"><span>${fmt(o)}</span></label>`).join('')+`<button class="btn" data-act="check" data-i="${i}">Check</button>`;
  const rows=q.a.split('\n').length;
  const f=rows>1?`<textarea class="ans" rows="${rows+1}" placeholder="Type the output"></textarea>`:`<input class="ans" type="text" autocomplete="off" spellcheck="false" placeholder="${q.kind==='term'?'Type the term':'Type your answer'}">`;
  return f+`<button class="btn" data-act="check" data-i="${i}">Check</button>`;
}
function render(){
  Q=pickSet();
  st=Q.map(()=>null);let h='',part='';
  Q.forEach((q,i)=>{
    if(q.part!==part){part=q.part;h+=`<h2>${esc(part)}</h2>`}
    h+=`<section class="q" id="q${i}"><div class="qh"><span class="n">${q.n}</span><span class="tag">${q.tag}</span></div><p class="p">${fmt(q.p)}</p>${q.code?`<pre>${esc(q.code)}</pre>`:''}<div class="b">${body(q,i)}</div><div class="fbw"></div></section>`;
  });
  document.getElementById('list').innerHTML=h;
  document.getElementById('res').style.display='none';
  upd();
}
function upd(){
  const a=st.filter(x=>x).length,c=st.filter(x=>x==='ok').length;
  document.getElementById('stat').textContent=`Answered ${a}/${Q.length} · Correct ${c}`;
  document.querySelector('#prog i').style.width=(a/Q.length*100)+'%';
}
function done(i,ok,extra){
  const q=Q[i],el=document.getElementById('q'+i);
  st[i]=ok?'ok':'bad';
  el.className='q '+st[i];
  el.querySelectorAll('button[data-act],input,textarea').forEach(x=>x.disabled=true);
  el.querySelector('.fbw').innerHTML=`<div class="fb ${st[i]}"><b>${ok?'Correct':'Not quite'}</b>${extra||''}${q.why?`<span class="why">${fmt(q.why)}</span>`:''}</div>`;
  upd();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const i=+b.dataset.i,q=Q[i],el=document.getElementById('q'+i),act=b.dataset.act;
  if(act==='pick'){
    const o=+b.dataset.o;
    el.querySelectorAll('.opt').forEach((x,j)=>{if(q.a.includes(j))x.classList.add('ok');else if(j===o)x.classList.add('bad')});
    done(i,q.a.includes(o));
  }else if(act==='check'){
    if(q.type==='multi'){
      const sel=[...el.querySelectorAll('input')].map((x,j)=>x.checked?j:-1).filter(j=>j>=0);
      if(!sel.length)return;
      el.querySelectorAll('.opt').forEach((x,j)=>{if(q.a.includes(j))x.classList.add('ok');else if(sel.includes(j))x.classList.add('bad')});
      done(i,sel.length===q.a.length&&sel.every(j=>q.a.includes(j)));
    }else{
      const v=el.querySelector('.ans').value;if(!v.trim())return;
      const ok=norm(q,v)===norm(q,q.a);
      done(i,ok,ok?'':`<div>Expected answer:</div><pre>${esc(q.a)}</pre><button class="btn ghost" data-act="mark" data-i="${i}">I was right</button>`);
    }
  }else if(act==='mark'){
    st[i]='ok';el.className='q ok';
    const f=el.querySelector('.fb');f.className='fb ok';f.querySelector('b').textContent='Correct';
    b.remove();upd();
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('input.ans')){e.preventDefault();e.target.closest('.q').querySelector('[data-act="check"]').click()}
});
document.getElementById('fin').onclick=()=>{
  const c=st.filter(x=>x==='ok').length,u=st.filter(x=>!x).length,r=document.getElementById('res');
  r.innerHTML=`<b>Score: ${c}/${Q.length} (${Math.round(c/Q.length*100)}%)</b>${u?` · ${u} unanswered`:''}`;
  r.style.display='block';r.scrollIntoView({behavior:'smooth',block:'start'});
};
document.getElementById('rst').onclick=()=>{render();window.scrollTo({top:0})};
render();
</script>
